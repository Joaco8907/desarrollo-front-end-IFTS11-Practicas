<!--Listas HTML
Crear tres tipos de listas: una desordenada (<ul>), una ordenada (<ol>) y una
de definición (<dl>) con al menos dos términos y sus descripciones.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas HTML</title>
</head>
<body>
    <h1>Crendo pagina con 3 listas de distintos tipos</h1>

    <!-- Lista desordenada -->   
    <ul> <!-- etiqueta para lista desordenada -->
        <li>perro</li>  <!-- etiqueta de elemento de lista -->
        <li>gato</li>   <!-- etiqueta de elemento de lista -->
        <li>pájaro</li> <!-- etiqueta de elemento de lista -->
    </ul>

    <!-- Lista ordenada -->
    <ol> <!-- etiqueta para lista ordenada -->
        <li>Primero</li>   <!-- etiqueta de elemento de lista -->
        <li>Segundo</li>   <!-- etiqueta de elemento de lista -->
        <li>Tercero</li>   <!-- etiqueta de elemento de lista -->
    </ol>

    <!-- Lista de definición -->
    <dl> <!-- etiqueta para lista de definición -->
        <dt>frontend: </dt> <!-- etiqueta de término -->
        <dd>Parte de una aplicación web que se ejecuta en el navegador</dd> <!-- etiqueta de descripción -->
        <dt>backend: </dt> <!-- etiqueta de término -->
        <dd>Parte de una aplicación web que se ejecuta en el servidor</dd> <!-- etiqueta de descripción -->
    </dl>
</body>
</html>
